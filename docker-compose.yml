version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: spiderman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spiderman
      POSTGRES_PASSWORD: spiderman
      POSTGRES_DB: spiderman
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spiderman -d spiderman"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: spiderman-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
